# SMV.AE admin configuration (Pages CMS)
#
# How to open the admin:
#   1. Go to https://app.pagescms.org and sign in with GitHub.
#   2. Authorise it for the ashrafselomotion-afk/smv-ae repository (one time).
#   3. This file defines every field you can edit. Save publishes to the live site.
#
# Anything you upload goes to assets/uploads. Every file there whose name starts
# with "placeholder-" is temporary artwork and is meant to be replaced.

media:
  input: assets/uploads
  output: assets/uploads

content:
  - name: site
    label: Site text and media
    type: file
    path: data/site.json
    fields:
      - name: brand
        label: Brand and navigation
        type: object
        fields:
          - { name: name, label: Name shown in the logo, type: string }
          - { name: suffix, label: Logo suffix (shown in red), type: string }
          - name: navLabels
            label: Menu labels
            type: object
            fields:
              - { name: work, label: Menu item 1, type: string }
              - { name: studio, label: Menu item 2, type: string }
              - { name: clients, label: Menu item 3, type: string }
              - { name: cta, label: Button label (used in the menu and the hero), type: string }

      - name: hero
        label: Opening screen
        type: object
        fields:
          - { name: line1, label: Headline line 1 (keep it short, it must fit one line), type: string }
          - { name: line2, label: Headline line 2 (keep it short, it must fit one line), type: string }
          - { name: sub, label: Supporting line (20 words maximum), type: text }
          - { name: ctaPrimary, label: Main button label, type: string }
          - { name: image, label: Opening image, type: image }
          - { name: video, label: 'Opening video instead of the image (Vimeo, YouTube, Drive or mp4 link). Leave empty to keep the image.', type: string }

      - { name: statement, label: Big statement sentence, type: text }

      - name: events
        label: Government event coverage
        type: object
        fields:
          - { name: heading, label: 'Big centred headline (use a line break for two lines)', type: text }
          - { name: body, label: Supporting line, type: text }
          - name: images
            label: Event photographs (these appear one by one as the visitor moves the mouse across the section)
            type: object
            list: true
            fields:
              - { name: image, label: Photograph, type: image }
              - { name: caption, label: Which event this is (used as the description for screen readers), type: string }

      - name: craft
        label: What we do
        type: object
        fields:
          - { name: eyebrow, label: Small label above the heading, type: string }
          - { name: heading, label: 'Heading (use a line break for two lines)', type: text }
          - name: items
            label: Disciplines
            type: object
            list: true
            fields:
              - { name: title, label: Title, type: string }
              - { name: tagline, label: One line description, type: string }
              - { name: image, label: Preview image, type: image }
              - { name: video, label: 'Preview video instead of the image (Vimeo, YouTube, Drive or mp4 link)', type: string }

      - name: gallery
        label: Work section
        type: object
        fields:
          - { name: heading, label: Heading, type: string }
          - name: filters
            label: Filter buttons
            type: object
            list: true
            fields:
              - { name: key, label: 'Category code (must match the category set on each project: all, video, photo, ai, motion, events)', type: string }
              - { name: label, label: Button label, type: string }

      - name: numbers
        label: Numbers band
        type: object
        list: true
        fields:
          - { name: value, label: Number (digits only, it counts up), type: number }
          - { name: suffix, label: 'Suffix, for example +', type: string }
          - { name: label, label: Label underneath, type: string }

      - name: clientsSection
        label: Clients section
        type: object
        fields:
          - { name: eyebrow, label: Small label above the heading, type: string }
          - { name: heading, label: 'Heading (use a line break for two lines)', type: text }

      - name: clients
        label: Client list (scrolls across the screen)
        type: object
        list: true
        fields:
          - { name: name, label: Client name, type: string }
          - { name: logo, label: 'Logo image (optional). Upload one and it replaces the name.', type: image }

      - name: contact
        label: Contact section
        type: object
        fields:
          - { name: heading, label: 'Heading (use a line break for two lines)', type: text }
          - { name: body, label: Supporting line, type: text }
          - { name: cta, label: Button label, type: string }
          - { name: email, label: Email, type: string }
          - { name: phone, label: Phone as you want it displayed, type: string }
          - { name: whatsapp, label: 'WhatsApp number, digits only, for example 9715XXXXXXXX', type: string }
          - { name: instagram, label: Instagram handle without the @, type: string }
          - { name: location, label: Studio location, type: string }

  - name: projects
    label: Work
    type: file
    path: data/projects.json
    fields:
      - name: projects
        label: Projects (shown in the order listed here)
        type: object
        list: true
        fields:
          - { name: id, label: 'Reference code, must be unique, for example p13', type: string }
          - { name: title, label: Title, type: string }
          - { name: client, label: Client, type: string }
          - { name: year, label: Year, type: string }
          - name: category
            label: Category
            type: select
            options:
              values:
                - { value: video, label: Video }
                - { value: photo, label: Photo }
                - { value: ai, label: AI }
                - { value: motion, label: Motion }
                - { value: events, label: Events }
          - { name: image, label: Cover image, type: image }
          - { name: video, label: 'Case video (Vimeo, YouTube, Google Drive or mp4 link). Opens when the project is clicked.', type: string }
          - { name: description, label: Description shown in the case view, type: text }
          - { name: featured, label: Show this one as the featured case (turn it on for one project only), type: boolean }
          - { name: challenge, label: Featured case paragraph, type: text }
          - name: stats
            label: Featured case numbers
            type: object
            list: true
            fields:
              - { name: value, label: 'Value, for example 48h', type: string }
              - { name: label, label: Label, type: string }
