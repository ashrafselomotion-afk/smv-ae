# SMV.AE — Pages CMS configuration (admin side)
# Connect this repo at https://app.pagescms.org — sign in with GitHub, pick the repo,
# and this file defines the whole editing UI. Same system as the portfolio site.

media:
  input: assets/uploads
  output: assets/uploads

content:
  - name: site
    label: Site Settings
    type: file
    path: data/site.json
    fields:
      - name: hero
        label: Hero
        type: object
        fields:
          - { name: line1, label: Headline — line 1, type: string }
          - { name: line2, label: Headline — line 2, type: string }
          - { name: sub, label: Subline, type: string }
          - { name: reel, label: Showreel video (mp4 URL or uploaded file path), type: string }
      - name: statement
        label: Statement paragraph
        type: text
      - name: disciplines
        label: What We Do
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: tagline, label: Tagline, type: string }
          - { name: clip, label: Background clip (mp4 URL or uploaded file path), type: string }
          - { name: hue, label: Placeholder hue (0–360, used until a clip is set), type: number }
      - name: numbers
        label: Numbers
        type: object
        list: true
        fields:
          - { name: value, label: Value, type: number }
          - { name: suffix, label: Suffix (e.g. +), type: string }
          - { name: label, label: Label, type: string }
      - name: clients
        label: Client names (shown in the logo strip)
        type: string
        list: true
      - name: process
        label: Process steps
        type: object
        list: true
        fields:
          - { name: title, label: Title, type: string }
          - { name: text, label: One line, type: string }
      - name: contact
        label: Contact
        type: object
        fields:
          - { name: headline, label: 'Headline (use \n for a line break)', type: string }
          - { name: email, label: Email, type: string }
          - { name: phone, label: Phone (display format), type: string }
          - { name: whatsapp, label: WhatsApp number (digits only, e.g. 9715XXXXXXXX), type: string }
          - { name: instagram, label: Instagram handle (no @), type: string }
          - { name: location, label: Location, type: string }

  - name: projects
    label: Projects
    type: file
    path: data/projects.json
    fields:
      - name: projects
        label: Projects
        type: object
        list: true
        fields:
          - { name: id, label: 'ID (unique, e.g. p13)', type: string }
          - { name: title, label: Title, type: string }
          - { name: client, label: Client, type: string }
          - { name: year, label: Year, type: string }
          - name: category
            label: Category
            type: select
            options:
              values:
                - { value: video, label: Video }
                - { value: photo, label: Photo }
                - { value: ai, label: AI }
                - { value: motion, label: Motion }
                - { value: events, label: Events }
          - name: size
            label: Grid size (span of 12 columns)
            type: select
            options:
              values: [ sp4, sp5, sp6, sp7, sp8 ]
          - { name: image, label: Thumbnail image, type: image }
          - { name: video, label: 'Case video — paste a Vimeo, YouTube, Google Drive or mp4 link', type: string }
          - { name: hue, label: Placeholder hue (0–360, used until an image is set), type: number }
          - { name: description, label: Description, type: text }
          - { name: featured, label: Featured case (only one should be on), type: boolean }
          - { name: challenge, label: Challenge line (featured case only), type: text }
          - name: stats
            label: Stats (featured case only)
            type: object
            list: true
            fields:
              - { name: value, label: Value (e.g. 48h), type: string }
              - { name: label, label: Label, type: string }
